<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مبدل تومان و دلار</title>
  <meta name="description" content="اپ ساده تبدیل تومان به دلار و بالعکس" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="app">

      <!-- وضعیت دریافت نرخ لحظه‌ای -->
      <div class="rate-status-card">
        <span id="rateStatus">در حال دریافت نرخ لحظه‌ای دلار…</span>
      </div>

      <!-- کارت اصلی تبدیل: دو ردیف ارز + دکمه جابه‌جایی -->
      <div class="converter-card">
        <div class="currency-row" id="rowTop" dir="ltr">
          <button type="button" class="currency-select" id="selectTop" aria-haspopup="false">
            <span class="flag-icon flag-us" id="flagTop" aria-hidden="true"></span>
            <span class="currency-code" id="codeTop">USD</span>
            <span class="chevron" aria-hidden="true">
              <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </button>
          <input type="text" inputmode="decimal" class="amount-input" id="inputTop" value="1" aria-label="مبلغ به دلار" />
        </div>

        <div class="currency-row" id="rowBottom" dir="ltr">
          <button type="button" class="currency-select" id="selectBottom" aria-haspopup="false">
            <span class="flag-icon flag-ir" id="flagBottom" aria-hidden="true"></span>
            <span class="currency-code" id="codeBottom">IRT</span>
            <span class="chevron" aria-hidden="true">
              <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </button>
          <input type="text" inputmode="decimal" class="amount-input" id="inputBottom" value="…" aria-label="مبلغ به تومان" disabled />
        </div>

        <button type="button" class="swap-btn" id="swapBtn" aria-label="جابه‌جایی ارزها">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 2v9M4 11L1.5 8.5M4 11l2.5-2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 14V5M12 5l2.5 2.5M12 5L9.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <!-- کارت خلاصه و نرخ‌ها -->
      <div class="summary-card" dir="rtl">
        <p class="summary-headline">
          هر <span id="headlineBase">1</span>
          <span id="headlineBaseUnit">دلار</span> معادل
          <span id="headlineQuote">…</span>
          <span id="headlineQuoteUnit">تومان</span>
        </p>

        <div class="info-row two-col">
          <div class="info-item">
            <span class="info-label">ارزش به تومان:</span>
            <span class="info-value" id="tomanValue">…</span>
          </div>
          <span class="info-divider" aria-hidden="true"></span>
          <div class="info-item">
            <span class="info-label">نرخ تبدیل:</span>
            <span class="info-value" id="rateValue">…</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="dist/main.js"></script>
</body>
</html>
